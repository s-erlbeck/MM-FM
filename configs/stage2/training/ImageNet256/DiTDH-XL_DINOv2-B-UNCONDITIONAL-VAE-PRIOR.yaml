stage_1:
  target: stage1.RAE
  params:
    encoder_cls: 'Dinov2withNorm'
    encoder_config_path: 'facebook/dinov2-with-registers-base'
    encoder_input_size: 224
    encoder_params:
      dinov2_path: 'facebook/dinov2-with-registers-base'
      normalize: true
    decoder_config_path: 'configs/decoder/ViTXL'
    pretrained_decoder_path: 'artifacts/decoders/dinov2-b/ViTXL_n08/model.pt'
    noise_tau: 0.0
    reshape_to_2d: true
    normalization_stat_path: 'artifacts/normalization_stats/dinov2-b/stat.pt'

stage_2:
  target: stage2.models.DDT.DiTwDDTHead
  params:
    input_size: 16
    patch_size: 1
    in_channels: 768
    hidden_size: [1152, 2048]
    depth: [28, 2]
    num_heads: [16, 16]
    mlp_ratio: 4.0
    class_dropout_prob: 0.0
    num_classes: 1000
    use_qknorm: false
    use_swiglu: true
    use_rope: true
    use_rmsnorm: true
    wo_shift: false
    use_pos_embed: true

    use_y_conditioning: false  # Model: c = silu(t + y)

transport:
  params:
    path_type: 'Linear'
    prediction: 'velocity'
    loss_weight: null
    time_dist_type: 'logit-normal_0_1'

sampler:
  mode: ODE
  params:
    sampling_method: 'euler'
    num_steps: 50
    atol: 1.0e-6
    rtol: 1.0e-3
    reverse: false

guidance:
  method: 'cfg'
  scale: 1.0  # No CFG for unconditional
  t_min: 0.0
  t_max: 1.0

gmm:
  enabled: false

# The flow's source distribution is a PatchTokenVAE fitted by src/scripts/fit_vae_imagenet.py.
# Training draws z ~ q(z|x1) (coupled to each image), inference draws z ~ N(0, I).
vae_prior:
  enabled: true
  ckpt_path: '/home/erlbeck/project_dir/personal/erlbeck/output/mm-fm/ckpt/vae/dinov2-beta_e-6/vae_final.pt'

  # p(x0|z) = N(decode(z), decoder_std^2 I). 0.0 => x0 = decode(z), with all coupling
  # stochasticity coming from z ~ q(z|x1). The MLE scale for this is sqrt(val/rec_loss)
  # of the VAE fit.
  decoder_std: 0.0

  # true  : training draws z ~ q(z|x1)  (coupled to each image)
  # false : training draws z ~ N(0, I)  (uncoupled ablation; matches inference)
  coupled: true

  require_normalized: true    # refuse a VAE fitted without --normalize

misc:
  latent_size: [768, 16, 16]
  num_classes: 1000  # ImageNet classes (for dataset compatibility)
  time_dist_shift_dim: 196608
  time_dist_shift_base: 4096

  adaptive_weighting:
    enabled: false

training:
  global_seed: 0
  epochs: 80
  global_batch_size: 1024
  grad_accum_steps: 8
  num_workers: 4
  log_every: 100
  ckpt_every: 5000
  sample_every: 25000
  initial_phase_epochs: 20
  initial_lr: 0.0002
  initial_ema_decay: 0.995
  base_lr: 0.0002
  final_lr: 0.00002
  ema_decay: 0.9995
  beta: [0.9, 0.95]
  wd: 0.0
  schedule_type: 'linear'
  decay_start_epoch: 40
  decay_end_epoch: 800
  clip_grad: 1.0

fid:
  enabled: true
  eval_every: 25000
  num_samples: 50000
  batch_size: 1
  ref_batch_path: 'artifacts/fid_reference/VIRTUAL_imagenet256_labeled.npz'

data_limit:
  enabled: false           # Set to true to enable data limiting
  sample_percentage: 0.1   # Percentage of samples to use per kept class (0.0-1.0)
  class_percentage: 0.2    # Percentage of classes to keep (0.0-1.0)
  seed: 42                 # Random seed for reproducible sampling
