stage_1:
  target: stage1.RAE
  params:
    encoder_cls: SigLIP2wNorm
    encoder_config_path: google/siglip2-base-patch16-256
    encoder_input_size: 256
    encoder_params:
      model_name: google/siglip2-base-patch16-256
    decoder_config_path: configs/decoder/ViTXL
    pretrained_decoder_path: artifacts/decoders/siglip2-b/ViTXL_n08/model.pt
    noise_tau: 0.0
    reshape_to_2d: true
    normalization_stat_path: artifacts/normalization_stats/siglip2-b/stat.pt
stage_2:
  target: stage2.models.DDT.DiTwDDTHead
  params:
    input_size: 16
    patch_size: 1
    in_channels: 768
    hidden_size:
    - 1152
    - 2048
    depth:
    - 28
    - 2
    num_heads:
    - 16
    - 16
    mlp_ratio: 4.0
    class_dropout_prob: 0.0
    num_classes: 8192
    use_qknorm: false
    use_swiglu: true
    use_rope: true
    use_rmsnorm: true
    wo_shift: false
    use_pos_embed: true
    use_y_conditioning: false
  ckpt: artifacts/checkpoints/siglip2-b/uncond-gmm-25k.pt
transport:
  params:
    path_type: Linear
    prediction: velocity
    loss_weight: null
    time_dist_type: uniform
sampler:
  mode: ODE
  params:
    sampling_method: euler
    num_steps: 50
    atol: 1.0e-06
    rtol: 0.001
    reverse: false
guidance:
  method: cfg
  scale: 1.0
  t_min: 0.0
  t_max: 1.0
gmm:
  enabled: true
  mode_conditional: false
  path: artifacts/gmm/siglip2-b/spatial_gmm_from_cls_n8192_diag_k-means++_flip.pkl
  cls_enabled: true
  cls_path: artifacts/gmm/siglip2-b/gmm_n8192_diag_k-means++.pkl
misc:
  latent_size:
  - 768
  - 16
  - 16
  num_classes: 1000
  time_dist_shift_dim: 196608
  time_dist_shift_base: 4096
